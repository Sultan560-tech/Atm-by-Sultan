<!DOCTYPE html>
<html>
<head>
    <title>Sultan`s ATM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="atm-container">

        <!-- LOGIN PAGE -->
        <div class="login-card">

            <div class="logo">SULTAN'S</div>

            <h1>ATM</h1>

            <p class="subtitle">Secure Banking System</p>

            <div class="input-group">
                <label>Enter 4-Digit PIN</label>
                <input type="password" maxlength="4" placeholder="••••">
            </div>

            <button class="login-btn">LOGIN</button>

            <p class="secure">🔒 Your PIN is protected</p>

        </div>


        <!-- ATM MENU -->
        <div class="menu-card">

            <h2>PERSONAL ATM</h2>

            <p class="welcome">Welcome, Sultan</p>

            <div class="balance">
                <span>Available Balance</span>
                <strong>₹ 0</strong>
            </div>

            <div class="buttons">

                <button class="balance-btn">Check Balance</button>

                <button class="deposit-btn">Deposit Money</button>

                <button class="withdraw-btn">Withdraw Money</button>

                <button class="account-btn">Account Information</button>

                <button class="history-btn">Transaction History</button>

                <button class="pin-btn">Change PIN</button>

                <button class="exit-btn">Exit Safely</button>

            </div>

        </div>

    </div>
<script src="script.js"></script>

</body>
</html>
